name: "Evidence: Ota bounded contributor verification (non-blocking)"

on:
  push:
    branches: [ota/adoption, bobai/ota-anodizer-v1.6.28]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-ci-drift:
    name: Contract-to-CI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare bounded contract truth with repository CI
        id: drift
        continue-on-error: true
        uses: ota-run/action@8001070c0c9e54ca2b729282df40d1a9f40c8a79 # v1.0.16
        with:
          command: doctor
          source: contract
          fail-on-error: false
          fail-on-ci-drift: true
          comment-pr: false
      - name: Preserve the drift-check outcome
        if: always()
        shell: bash
        run: test "${{ steps.drift.outcome }}" = success

  native:
    name: Ota contributor path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare retained evidence
        shell: bash
        run: mkdir -p ota-pressure/native
      - name: Set up repository-owned contributor tooling
        id: tooling
        continue-on-error: true
        uses: ./.github/actions/setup-rust
        with:
          task: "true"
          tools: cargo-nextest
          nfpm: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up WiX for the Windows source-owned test path
        id: wix
        continue-on-error: true
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf '%s\n' 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
          dotnet tool install --global wix || dotnet tool update --global wix
      - name: Set up macOS scanner tools used by the source-owned test path
        id: macos_tools
        continue-on-error: true
        if: runner.os == 'macOS'
        run: brew install bash grep gawk
      - name: Set up Ota from the contract
        id: ota
        continue-on-error: true
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Record tool identities
        id: posture
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          rustc --version --verbose > ota-pressure/native/rustc-version.txt
          cargo --version --verbose > ota-pressure/native/cargo-version.txt
          task --version > ota-pressure/native/task-version.txt
          cargo nextest --version > ota-pressure/native/nextest-version.txt
          ota --version --json > ota-pressure/native/ota-version.json
      - name: Validate contract
        id: validate
        if: always()
        continue-on-error: true
        shell: bash
        run: ota validate . 2>&1 | tee ota-pressure/native/validate.txt
      - name: Diagnose bounded readiness
        id: doctor
        if: always()
        continue-on-error: true
        shell: bash
        run: ota doctor --workflow verify --native --json . > ota-pressure/native/doctor.json
      - name: Preview selected native graph
        id: preview
        if: always()
        continue-on-error: true
        shell: bash
        run: ota up --workflow verify --native --agent --dry-run . --json > ota-pressure/native/up-dry-run.json
      - name: Run bounded native type check
        id: check
        if: always()
        continue-on-error: true
        shell: bash
        run: ota run check --native --agent --stream . 2>&1 | tee ota-pressure/native/check.txt
      - name: Run bounded native contributor verification
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ota run verify --native --agent --stream . 2>&1 | tee ota-pressure/native/verify.txt
          git diff --exit-code
      - name: Record exact native outcomes
        if: always()
        shell: bash
        run: |
          cat > ota-pressure/native/outcomes.txt <<EOF
          revision=${GITHUB_SHA}
          os=${{ matrix.os }}
          tooling=${{ steps.tooling.outcome }}
          wix=${{ steps.wix.outcome }}
          macos_tools=${{ steps.macos_tools.outcome }}
          ota=${{ steps.ota.outcome }}
          posture=${{ steps.posture.outcome }}
          validate=${{ steps.validate.outcome }}
          doctor=${{ steps.doctor.outcome }}
          preview=${{ steps.preview.outcome }}
          check=${{ steps.check.outcome }}
          verify=${{ steps.verify.outcome }}
          EOF
          git status --porcelain=v1 > ota-pressure/native/post-run-status.txt
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anodizer-ota-${{ matrix.os }}
          path: ota-pressure/native/
          if-no-files-found: error
      - name: Preserve truthful native failure
        if: always()
        shell: bash
        run: |
          test "${{ steps.tooling.outcome }}" = success
          test "${{ steps.wix.outcome }}" = success || test "${{ steps.wix.outcome }}" = skipped
          test "${{ steps.macos_tools.outcome }}" = success || test "${{ steps.macos_tools.outcome }}" = skipped
          test "${{ steps.ota.outcome }}" = success
          test "${{ steps.posture.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.doctor.outcome }}" = success
          test "${{ steps.preview.outcome }}" = success
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success

  container:
    name: Ota contributor path (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare retained evidence
        shell: bash
        run: mkdir -p ota-pressure/container
      - name: Set up Ota from the contract
        id: ota
        continue-on-error: true
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Build the Ota-owned pressure image
        id: image
        continue-on-error: true
        run: >-
          docker build --pull --platform linux/amd64 --file .github/ota/Dockerfile
          --tag anodizer-ota-pressure:1.0 .
      - name: Record container tool identities
        id: posture
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker version --format 'server_os={{.Server.Os}} server_arch={{.Server.Arch}}' > ota-pressure/container/engine.txt
          docker image inspect anodizer-ota-pressure:1.0 > ota-pressure/container/image.json
          docker run --rm --platform linux/amd64 anodizer-ota-pressure:1.0 bash -c '
            uname -m
            rustc --version --verbose
            cargo --version --verbose
            task --version
            cargo nextest --version
            nfpm --version
          ' > ota-pressure/container/toolchain-versions.txt
      - name: Preview selected container graph
        id: preview
        if: always()
        continue-on-error: true
        shell: bash
        run: ota up --workflow verify --container --agent --dry-run . --json > ota-pressure/container/up-dry-run.json
      - name: Run bounded container type check
        id: check
        if: always()
        continue-on-error: true
        shell: bash
        run: ota run check --container --agent --stream . 2>&1 | tee ota-pressure/container/check.txt
      - name: Run bounded container contributor verification
        id: verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ota run verify --container --agent --stream . 2>&1 | tee ota-pressure/container/verify.txt
          git diff --exit-code
      - name: Record exact container outcomes
        if: always()
        shell: bash
        run: |
          cat > ota-pressure/container/outcomes.txt <<EOF
          revision=${GITHUB_SHA}
          ota=${{ steps.ota.outcome }}
          image=${{ steps.image.outcome }}
          posture=${{ steps.posture.outcome }}
          preview=${{ steps.preview.outcome }}
          check=${{ steps.check.outcome }}
          verify=${{ steps.verify.outcome }}
          EOF
          git status --porcelain=v1 > ota-pressure/container/post-run-status.txt
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anodizer-ota-container
          path: ota-pressure/container/
          if-no-files-found: error
      - name: Preserve truthful container failure
        if: always()
        shell: bash
        run: |
          test "${{ steps.ota.outcome }}" = success
          test "${{ steps.image.outcome }}" = success
          test "${{ steps.posture.outcome }}" = success
          test "${{ steps.preview.outcome }}" = success
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success

  disposable-determinism:
    name: Ota disposable preflight and drift boundaries (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust and test tooling
        uses: ./.github/actions/setup-rust
        with:
          task: "true"
          tools: cargo-nextest
          nfpm: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Ota from the contract
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Preview disposable task graph
        shell: bash
        run: ota run pressure:verify --native --dry-run --json . > pressure-preview.json
      - name: Exercise preflight, two builds, and controlled drift
        shell: bash
        run: ota run pressure:verify --native --stream .
      - name: Retain separate outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anodizer-ota-disposable-determinism
          path: |
            pressure-preview.json
            .ota/pressure/evidence/
          include-hidden-files: true
          if-no-files-found: error
