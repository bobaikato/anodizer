version: 1

metadata:
  ota:
    minimum_version: "1.6.28"

project:
  name: anodizer
  description: Bounded contributor verification for Anodizer's current Rust release-automation workspace
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      env:
        CARGO_HOME: .ota/cache/cargo-native
    pressure-container:
      backend: container
      lifecycle: ephemeral
      env:
        CARGO_HOME: /workspace/.ota/cache/cargo-container
        ANODIZER_COLOR: never
      container:
        image: anodizer-ota-pressure:1.0
        platform: linux/amd64
        engines: [docker]
      requirements:
        tools:
          nfpm: "*"
      attachments:
        isolated_paths:
          - .ota/cache/cargo-container

toolchains:
  rust:
    # `task test` pins Cargo's discriminator behavior to the upstream-verified 1.98 line.
    version: ">=1.98,<1.99"

tools:
  task: "*"
  cargo-nextest: "*"
  nfpm:
    # CI installs 2.46.3 and records its identity; v1.6.28 misreads nfpm's banner as `0-dependencies`.
    version: "*"
    only_on: [linux]

tasks:
  setup:cargo:native:
    description: Hydrate Anodizer's locked Cargo dependencies into Ota's native cache
    category: setup
    command:
      exe: cargo
      args: [fetch, --locked]
    requirements:
      toolchains: [rust]
    effects:
      writes: [.ota/cache/cargo-native]
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true

  setup:cargo:container:
    description: Hydrate Anodizer's locked Cargo dependencies into the isolated container cache
    category: setup
    command:
      exe: cargo
      args: [fetch, --locked]
    requirements:
      toolchains: [rust]
    effects:
      writes: [.ota/cache/cargo-container]
      network: true
      network_kind: dependency_hydration
    execution:
      default_mode: container
      modes:
        container:
          context: pressure-container
          command:
            exe: bash
            args: [.github/ota/with-container-user.sh, cargo, fetch, --locked]
    safe_for_agent: true

  check:
    description: Run Anodizer's repository-owned two-pass workspace type check
    notes: |
      Runs the current `task check` command: default-feature workspace checking followed by all-target
      checking. It does not construct release artifacts, publish, sign, attest, or contact registries.
    category: verify
    command:
      exe: task
      args: [check]
    requirements:
      toolchains: [rust]
      tools:
        task: "*"
    effects:
      writes: [target]
    execution:
      default_mode: native
      modes:
        native:
          context: host
          depends_on: [setup:cargo:native]
        container:
          context: pressure-container
          depends_on: [setup:cargo:container]
          command:
            exe: bash
            args: [.github/ota/with-container-user.sh, task, check]
    safe_for_agent: true

  test:
    description: Run Anodizer's repository-owned workspace nextest and doctest suite
    notes: |
      Runs the current `task test` command. The pressure workflow separately provisions the same
      repository CI test prerequisites for each operating system. Passing does not prove release
      construction, signing, publication, registry propagation, rollback, recovery, or every CI job.
    category: test
    command:
      exe: task
      args: [test]
    requirements:
      toolchains: [rust]
      tools:
        task: "*"
        cargo-nextest: "*"
    effects:
      writes: [target]
    execution:
      default_mode: native
      modes:
        native:
          context: host
          depends_on: [setup:cargo:native]
        container:
          context: pressure-container
          depends_on: [setup:cargo:container]
          command:
            exe: bash
            args: [.github/ota/with-container-user.sh, task, test]
    safe_for_agent: true

  verify:
    description: Run the bounded cross-platform contributor verification slice
    notes: |
      Aggregates the current repository-owned workspace test suite. The selected path is deliberately
      narrower than Anodizer's release, package, snapshot, determinism, coverage, publishing, signing,
      attestation, registry, rollback, recovery, and documentation deployment workflows.
    category: verify
    aggregate:
      tasks: [test]
    safe_for_agent: true

  pressure:build-cli:
    description: Build Anodizer's own CLI for a disposable Linux determinism exercise
    category: setup
    command:
      exe: cargo
      args: [build, --locked, -p, anodizer, --bin, anodizer]
    depends_on: [setup:cargo:native]
    requirements:
      toolchains: [rust]
    effects:
      writes: [target]
    safe_for_agent: false

  pressure:prepare:
    description: Create a tiny disposable Rust workspace with a fixed Git revision
    category: setup
    command:
      exe: bash
      args: [.github/ota/determinism-fixture.sh, prepare]
    depends_on: [pressure:build-cli]
    effects:
      writes: [.ota/pressure]
    safe_for_agent: false

  pressure:preflight:
    description: Record Anodizer's configuration preflight for the disposable workspace
    category: verify
    command:
      exe: bash
      args: [.github/ota/determinism-fixture.sh, preflight]
    depends_on: [pressure:prepare]
    effects:
      writes: [.ota/pressure]
    safe_for_agent: false

  pressure:determinism:
    description: Require two builds of the disposable workspace to compare byte-for-byte
    category: verify
    command:
      exe: bash
      args: [.github/ota/determinism-fixture.sh, positive]
    depends_on: [pressure:preflight]
    requirements:
      tools:
        jq: "*"
    effects:
      writes: [.ota/pressure]
    safe_for_agent: false

  pressure:controlled-failure:
    description: Require Anodizer to detect an injected archive-byte drift
    category: verify
    command:
      exe: bash
      args: [.github/ota/determinism-fixture.sh, negative]
    depends_on: [pressure:determinism]
    requirements:
      tools:
        jq: "*"
    effects:
      writes: [.ota/pressure]
    safe_for_agent: false

  pressure:verify:
    description: Retain separate preflight, reproducibility, and controlled-drift results
    category: verify
    aggregate:
      tasks: [pressure:controlled-failure]
    safe_for_agent: false

workflows:
  default: verify
  verify:
    intent: ci_validation
    description: Verify Anodizer's bounded non-credentialed contributor path
    run:
      task: verify
    notes: |
      The pressure workflow exercises the selected task path on Ubuntu, macOS, Windows, and one
      provisioned Linux/x86_64 container. On a non-x86_64 host, local container results are
      emulation evidence only; the Ubuntu GitHub container job records its engine and target
      architectures and is the native Linux/x86_64 proof for that lane. Ota selects and records
      the bounded path; repository CI remains the owner of platform-specific test prerequisites
      and every unselected release-system lane.
  pressure:
    intent: ci_validation
    description: Exercise Anodizer's CLI on one disposable Linux Rust workspace
    run:
      task: pressure:verify
    notes: |
      This separately records config preflight, a positive two-build byte comparison, and
      deliberate archive drift detection. It is test-harness evidence, not the upstream
      release determinism matrix or proof of publication, signing, rollback, or recovery.

agent:
  posture: readiness_strict
  entrypoint: verify
  default_task: verify
  safe_tasks:
    - setup:cargo:native
    - setup:cargo:container
    - check
    - test
    - verify
  verify_after_changes: [verify]
  writable_paths:
    - .ota
    - target
  protected_paths:
    - .github/workflows
    - Cargo.lock
    - Taskfile.yml
    - ota.yaml
  bootstrap:
    ota:
      note: Install the reviewed Ota v1.6.28 release for this advisory contributor lane.
      source:
        kind: version
        version: v1.6.28
  notes: |
    Use `ota tasks --safe --use` before selecting work. Anodizer owns release-system correctness;
    Ota owns only the declared preparation, selected contributor tasks, and evidence boundary.
    Do not infer release readiness, publication, signing, attestation, registry propagation, rollback,
    recovery, adoption, endorsement, or whole-repository governance from this bounded lane.
