version: 1

metadata:
  ota:
    minimum_version: "1.6.28"

project:
  name: anodizer
  description: Cross-platform Rust release automation with a bounded contributor verification lane
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      env:
        CARGO_HOME: .ota/cache/cargo-native
    pressure-container:
      backend: container
      lifecycle: ephemeral
      env:
        CARGO_HOME: /workspace/.ota/cache/cargo-container
        # Taskfile.yml disables ANSI only when GITHUB_ACTIONS is present; the
        # isolated container deliberately does not inherit that host marker.
        ANODIZER_COLOR: never
      container:
        image: anodizer-ota-pressure:1.0
        platform: linux/amd64
        engines:
          - docker
      attachments:
        isolated_paths:
          - .ota/cache/cargo-container

toolchains:
  rust:
    version: "=1.97.1"
  node:
    version: "=18.20.4"

tasks:
  setup:cargo:native:
    description: Hydrate locked Cargo dependencies into Ota's repository-local native cache
    category: setup
    command:
      exe: cargo
      args: [fetch, --locked]
    requirements:
      toolchains: [rust]
    effects:
      writes: [.ota/cache/cargo-native]
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true

  setup:cargo:container:
    description: Hydrate locked Cargo dependencies into Ota's isolated container cache
    category: setup
    command:
      exe: cargo
      args: [fetch, --locked]
    requirements:
      toolchains: [rust]
    effects:
      writes: [.ota/cache/cargo-container]
      network: true
      network_kind: dependency_hydration
    execution:
      default_mode: container
      modes:
        container:
          context: pressure-container
    safe_for_agent: true

  check:
    description: Run Anodizer's two-pass workspace type check
    category: verify
    command:
      exe: task
      args: [check]
    requirements:
      toolchains: [rust]
    effects:
      writes: [target]
    execution:
      default_mode: native
      modes:
        native:
          context: host
          depends_on: [setup:cargo:native]
        container:
          context: pressure-container
          depends_on: [setup:cargo:container]
    safe_for_agent: true

  test:
    description: Run Anodizer's complete workspace nextest and doctest suite
    notes: |
      This preserves the repository-owned `task test` boundary. Linux is provisioned with Node.js
      and nFPM, and Windows with WiX, so their platform probes do not silently lose those exercised
      paths.
    category: test
    command:
      exe: task
      args: [test]
    requirements:
      toolchains: [rust, node]
    effects:
      writes: [target]
    execution:
      default_mode: native
      modes:
        native:
          context: host
          depends_on: [setup:cargo:native]
        container:
          context: pressure-container
          depends_on: [setup:cargo:container]
    safe_for_agent: true

  verify:
    description: Run the bounded cross-platform contributor verification slice
    notes: |
      Success covers locked hydration, Anodizer's two-pass Cargo check, nextest suite, and
      doctests in the selected environment. It does not prove release construction, artifact
      determinism, signing, OIDC publication, registry propagation, rollback, recovery, or
      repository-wide release readiness.
    category: verify
    aggregate:
      tasks:
        - check
        - test
    safe_for_agent: true

workflows:
  default: verify
  verify:
    intent: ci_validation
    description: Verify Anodizer's bounded non-credentialed contributor path
    run:
      task: verify
    notes: |
      The pressure workflow runs this exact slice on Ubuntu, macOS, Windows, and one provisioned
      Linux container. Release publication and every credentialed or irreversible release path
      remain outside this workflow and outside its evidence claim.

agent:
  posture: readiness_strict
  entrypoint: verify
  default_task: verify
  safe_tasks:
    - setup:cargo:native
    - setup:cargo:container
    - check
    - test
    - verify
  verify_after_changes:
    - verify
  writable_paths:
    - crates
    - docs
    - tests
    - .ota/cache
    - target
  protected_paths:
    - .github/workflows
    - Cargo.lock
    - Taskfile.yml
  bootstrap:
    ota:
      note: Install the exact active Ota branch only for this unreleased pressure lane.
      source:
        kind: branch
        branch: 1.6.28-implementation
  notes: |
    Use `ota tasks --safe --use` before selecting work. The default workflow is deliberately
    narrower than Anodizer's release system. Do not infer release, publishing, signing, registry,
    rollback, recovery, or whole-repository readiness from a green result. The repository package
    metadata declares Rust 1.87, but the current locked dependency graph requires up to Rust 1.94
    and the source-owned test suite pins Cargo 1.97 behavior. This pressure contract therefore uses
    Rust 1.97.1 without claiming the declared MSRV is valid.
